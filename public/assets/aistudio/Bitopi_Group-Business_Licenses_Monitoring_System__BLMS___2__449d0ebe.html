  closeDocUrl();
  state.docView = { ref: id, idx: idx || 0 };
  render();
};
window.viewDraftDoc = function (idx) { captureEntryForm(); closeDocUrl(); state.docView = { ref: null, idx }; render(); };
function closeDocUrl() { if (state.docView && state.docView.url) { try { URL.revokeObjectURL(state.docView.url); } catch (e) {} } }
window.closeDocView = function (ev) { if (ev && ev.target && !ev.target.classList.contains('modal-overlay')) return; closeDocUrl(); state.docView = null; render(); };
window.selectDoc = function (idx) { closeDocUrl(); state.docView.idx = idx; state.docView.url = null; render(); };
window.downloadDoc = async function (ref, idx) {
  const d = docsFor(ref)[idx];
  if (!d) return;
  const l = ref ? state.licenses.find(x => x.id === ref) : null;
  const ok = await saveGeneratedFile(d.name, dataUrlToBlob(d.data), 'Downloaded ' + d.name);
  if (ok && l) auditLog('Export', 'Document', l.id, l.company, 'Downloaded document ' + d.name + ' of ' + l.name, []);
};
function renderDocViewer() {
  const v = state.docView, docs = docsFor(v.ref);
  if (!docs.length) return '';
  const idx = Math.min(v.idx || 0, docs.length - 1), d = docs[idx];
  const l = v.ref ? state.licenses.find(x => x.id === v.ref) : null;
  const ext = docExt(d.name);
  if (ext === 'pdf' && !v.url) { try { v.url = URL.createObjectURL(dataUrlToBlob(d.data)); } catch (e) {} }
  const preview = ext === 'pdf'
    ? (v.url ? `<iframe src="${v.url}" title="${escHtml(d.name)}"></iframe>` : '')
    : `<img src="${d.data}" alt="${escHtml(d.name)}">`;
  const pdfNote = ext === 'pdf' ? `<div style="font-size:11px;color:var(--color-text-tertiary);margin-top:6px">If the PDF does not display in this view, use Download to open it on your device.</div>` : '';
  return `<div class="modal-overlay" onclick="closeDocView(event)">
    <div class="modal wide">
      <div class="modal-header">
        <span class="modal-title">${ic('paperclip')} Documents — ${escHtml(l ? l.name : (state.editEntry || state.newEntry).name || 'New entry')}</span>
        <button class="close-btn" onclick="closeDocView()" aria-label="Close">${ic('x')}</button>
      </div>
      <div style="padding:16px">
        ${l ? `<div style="margin-bottom:10px;font-size:12px;color:var(--color-text-secondary)">${l.id} · ${l.company} · ${l.type}</div>` : ''}
        <div class="doc-list" style="margin-top:0;margin-bottom:12px">${docs.map((x, i) => `<div class="doc-item${i === idx ? ' sel' : ''}">
          ${ic('file','style="font-size:14px;color:var(--color-text-tertiary)"')}
          <span class="doc-badge">${escHtml(docExt(x.name).toUpperCase())}</span>
          <button type="button" class="doc-name" onclick="selectDoc(${i})">${escHtml(x.name)}</button>
          <span class="doc-meta">${fmtSize(x.size)} · ${escHtml(x.by || '')} · ${new Date(x.at).toLocaleDateString()}</span>
          <button type="button" class="btn btn-sm" title="Download" onclick="downloadDoc(${v.ref ? `'${v.ref}'` : 'null'},${i})">${ic('download')}</button>
        </div>`).join('')}</div>
        <div class="doc-preview">${preview}</div>
        ${pdfNote}

      <div class="form-actions"><button class="btn" onclick="closeDocView()">Close</button></div>

}

window.saveEntry = (autoId, isEdit)=>{
  const get = id=>document.getElementById(id)?.value||'';
  const entry = {
    id: autoId,
    company: get('f_company'),
    year: get('f_year'),
    type: get('f_type'),
    name: get('f_name'),
    number: get('f_number'),
    from: get('f_from'),
    till: get('f_till'),
    status: get('f_status'),
    category: get('f_category') || 'Renewal',
    comments: get('f_comments'),
    action: get('f_action'),
    feedback: isEdit==='true' ? (state.editEntry?.feedback||'') : '',
    docs: ((isEdit==='true' ? state.editEntry : state.newEntry)?.docs || []).slice()
  };
  VEHICLE_FIELDS.forEach(f => { entry[f[0]] = entry.type === VEHICLE_TYPE ? get('f_' + f[0]).trim() : ''; });
  if (entry.category === 'One-time' && entry.type !== VEHICLE_TYPE) entry.till = '';
  if (entry.type === VEHICLE_TYPE) {
    // No separate name / number / validity / status for vehicles: derive them from the vehicle details.
    if (!entry.vNumber) { showToast('Please enter the Vehicle Number.', 'error'); return; }
    entry.name = 'Vehicle ' + entry.vNumber + (entry.vModel ? ' — ' + entry.vModel : '');
    entry.number = entry.vNumber;
    entry.from = '';
    const exp = [entry.vTaxToken, entry.vFitness, entry.vInsurance, entry.vRoutePermit].filter(Boolean).sort();
    entry.till = exp[0] || '';
    entry.status = 'Valid';
  }
  if(!entry.type||!entry.name){showToast('Please select Type and License Name.', 'error');return;}
  if(!can('entry', entry.company)){showToast('Your role in '+entry.company+' ('+roleIn(entry.company)+') does not allow saving records.', 'error');return;}
  const prevEntry = isEdit==='true' ? state.licenses.find(l=>l.id===entry.id) : null;
  const prevCopy = prevEntry ? JSON.parse(JSON.stringify(prevEntry)) : null;
  if (prevEntry && prevEntry.locked && !can('review', prevEntry.company)) { showToast('This record is approved and locked by the reviewer.', 'error'); return; }
  let sentBack = false;
  if(isEdit==='true'){
    const i=state.licenses.findIndex(l=>l.id===entry.id);
    if(i>-1){
      Object.keys(entry).forEach(k=>{ if (entry[k]===undefined) delete entry[k]; });
      const merged = Object.assign({}, prevEntry, entry);
      if (prevEntry && prevEntry.reviewState === RV.WAIT_DEPT && can('entry', merged.company) && !can('review', merged.company)) {
        const ch0 = diffFields(prevCopy, merged, LICENSE_AUDIT_FIELDS);
        merged.thread = [...threadOf(prevEntry), { id: Date.now().toString(36), at: Date.now(), by: currentUser().name, system: true, from: 'Dept', text: 'Record updated by ' + currentUser().name + (ch0.length ? ' (' + ch0.map(c=>c.field).join(', ') + ')' : '') + ' — returned to reviewer' }];
        merged.reviewState = RV.WAIT_REV; sentBack = true;
      }
      state.licenses[i]=merged;
    }
  } else {
    state.licenses.push(entry);
  }
  if (prevCopy) {
    const ch = diffFields(prevCopy, entry, LICENSE_AUDIT_FIELDS);
    auditLog('Updated', 'License', entry.id, entry.company, `Updated ${entry.name}` + (ch.length?'':' (no field changes)'), ch);
  } else {
    auditLog('Created', 'License', entry.id, entry.company, `Created ${entry.name}`, [
      {field:'Type', from:'—', to:entry.type}, {field:'Lic. no.', from:'—', to:entry.number||'—'},
      {field:'Valid till', from:'—', to:entry.till||'—'}, {field:'Status', from:'—', to:entry.status||'—'}].concat(entry.docs.length ? [{field:'Documents', from:'—', to:docNames(entry)}] : []));
  }
  logActivity(isEdit==='true'?'entry-update':'entry-add', `${isEdit==='true'?'Updated':'Added'} <b>${entry.name}</b> (${entry.id})`, entry.company);
  state.editEntry=null;state.newEntry={};
  showToast((isEdit==='true'?'Updated':'Saved')+' successfully!'+(sentBack?' Sent back to the reviewer.':''), 'success');
  render();
};

// =====================================================================
// Review workflow — two-way feedback between Reviewer and Concerned Dept
// Each licence carries a `thread` of messages. Reviewer → Dept sets the
// state to "Awaiting Dept"; the Dept's reply (or an update of the record)
// sets it to "Awaiting Reviewer"; the reviewer can Approve & lock, which
// closes the thread and locks the record until it is reopened.
// =====================================================================
const RV = { WAIT_DEPT: 'Awaiting Dept', WAIT_REV: 'Awaiting Reviewer', CLOSED: 'Closed' };
function ensureThread(l) {
  if (!l.thread && l.feedback) { l.thread = [{ id: 'm0', at: null, by: 'Verifier', from: 'Reviewer', text: l.feedback }]; if (!l.reviewState) l.reviewState = RV.WAIT_DEPT; }
  return l.thread || [];
}
function threadOf(l) { return l.thread || []; }
function rvPriority(l) { const s = l.reviewState; return s === RV.WAIT_REV ? 0 : !s ? 1 : s === RV.WAIT_DEPT ? 2 : 3; }
function reviewChip(l) {
  if (l.reviewState === RV.WAIT_DEPT) return `<span class="badge badge-amber" title="The reviewer is waiting for the concerned department">Reply needed</span>`;
  if (l.reviewState === RV.WAIT_REV) return `<span class="badge badge-blue" title="The department has replied — the reviewer is next">With reviewer</span>`;
  if (l.reviewState === RV.CLOSED) return `<span class="badge badge-green" title="Approved and locked by the reviewer">${ic('lock','style="font-size:10px"')} Approved</span>`;
  return '';
}
function waitingForMe(l) {
  return (can('review', l.company) && l.reviewState === RV.WAIT_REV) || (can('entry', l.company) && !can('review', l.company) && l.reviewState === RV.WAIT_DEPT);
}
function menuCount(id) {
  if (id === 'feedback') return scopedLicenses().filter(waitingForMe).length;
  return 0;
}
function renderThread(l) {
  const t = threadOf(l);
  if (!t.length) return '';
  return `<div class="thread">${t.map(m => m.system
    ? `<div class="rv-msg sys">${escHtml(m.text)}${m.at ? ' · ' + escHtml(fmtTs(m.at)) : ''}</div>`
    : `<div class="rv-msg ${m.from === 'Reviewer' ? 'rev' : 'dept'}"><div class="meta">${m.from === 'Reviewer' ? 'Reviewer' : 'Concerned Dept'} · ${escHtml(m.by || '')}${m.at ? ' · ' + escHtml(fmtTs(m.at)) : ''}</div>${escHtml(m.text)}</div>`).join('')}</div>`;
}
function rvCompose(l, from) {
  const key = from + '_' + l.id;
  const label = from === 'Reviewer' ? 'Send to Concerned Dept' : 'Reply to Reviewer';
  const ph = from === 'Reviewer' ? 'Write feedback or instructions for the concerned department…' : 'Write your reply to the reviewer — what you changed or why…';
  return `<div style="display:flex;gap:6px;margin-top:8px;align-items:flex-end">
    <textarea class="form-control" rows="2" style="flex:1;font-size:12px;padding:6px 8px;resize:vertical;font-family:inherit" placeholder="${ph}" oninput="state.rvDraft['${key}']=this.value" id="rv_${key}">${escHtml(state.rvDraft[key] || '')}</textarea>
    <button class="btn btn-sm btn-primary" onclick="postThread('${l.id}','${from}')">${ic(from === 'Reviewer' ? 'message' : 'check')} ${label}</button>
  </div>`;
}
window.postThread = (id, from) => {
  const l = state.licenses.find(x => x.id === id); if (!l) return;
  const key = from + '_' + id, box = document.getElementById('rv_' + key);
  const text = ((box && box.value) || state.rvDraft[key] || '').trim();
  if (from === 'Reviewer' && !can('review', l.company)) { showToast('Your role in ' + l.company + ' does not allow sending review feedback.', 'error'); return; }
  if (from === 'Dept' && !can('entry', l.company)) { showToast('Your role in ' + l.company + ' does not allow replying for the concerned department.', 'error'); return; }
  if (from === 'Dept' && l.locked) { showToast('This record is approved and locked. Ask the reviewer to reopen it.', 'error'); return; }
  if (!text) { showToast('Type a message first.', 'error'); return; }
  ensureThread(l);
  l.thread = [...threadOf(l), { id: Date.now().toString(36), at: Date.now(), by: currentUser().name, from, text }];
  l.reviewState = from === 'Reviewer' ? RV.WAIT_DEPT : RV.WAIT_REV;
  if (from === 'Reviewer') { l.feedback = text; l.locked = false; }
  delete state.rvDraft[key];
  auditLog('Review', 'License', l.id, l.company, from === 'Reviewer' ? `Feedback sent to concerned dept on ${l.name}` : `Reply sent to reviewer on ${l.name}`,
    [{ field: from === 'Reviewer' ? 'Reviewer → Dept' : 'Dept → Reviewer', from: '—', to: text }]);
  logActivity('review', from === 'Reviewer' ? `Reviewer feedback sent on <b>${l.name}</b> (${l.id})` : `Dept replied to reviewer on <b>${l.name}</b> (${l.id})`, l.company);
  showToast(from === 'Reviewer' ? 'Feedback sent to the concerned department.' : 'Reply sent to the reviewer.', 'success');
  render();
};
window.approveReview = id => {
  const l = state.licenses.find(x => x.id === id); if (!l) return;
  if (!can('review', l.company)) { showToast('Your role in ' + l.company + ' does not allow approving.', 'error'); return; }
  const key = 'Reviewer_' + id, box = document.getElementById('rv_' + key);
  const note = ((box && box.value) || state.rvDraft[key] || '').trim();
  ensureThread(l);
  const msgs = [...threadOf(l)];
  if (note) { msgs.push({ id: Date.now().toString(36), at: Date.now(), by: currentUser().name, from: 'Reviewer', text: note }); l.feedback = note; }
  msgs.push({ id: Date.now().toString(36) + 'c', at: Date.now(), by: currentUser().name, system: true, from: 'Reviewer', text: 'Approved and locked by ' + currentUser().name });
  l.thread = msgs; l.reviewState = RV.CLOSED; l.locked = true; delete state.rvDraft[key];
  auditLog('Review', 'License', l.id, l.company, `Review approved and record locked: ${l.name}`, [{ field: 'Review', from: '—', to: 'Approved & locked' + (note ? ' — ' + note : '') }]);
  logActivity('review', `Review approved and locked: <b>${l.name}</b> (${l.id})`, l.company);
  showToast('Approved. The record is locked until you reopen it.', 'success'); render();
};
window.reopenReview = id => {
  const l = state.licenses.find(x => x.id === id); if (!l) return;

  auditLog('Review', 'License', l.id, l.company, `Review reopened: ${l.name}`, [{ field: 'Review', from: 'Approved & locked', to: 'Reopened — awaiting dept' }]);

  showToast('Reopened. The department can update the record and reply.', 'success'); render();

window.setRvFilter = f => { state.rvFilter = f; render(); };
function rvHead(l) {
  const days = daysUntil(l.till), sc = statusColor(days, l.type, l.status), sl = statusLabel(days, l.status, l.type);
  const colors = { red: '#FCEBEB|#A32D2D', amber: '#FAEEDA|#854F0B', green: '#EAF3DE|#3B6D11', gray: '#F1EFE8|#5F5E5A' };
  const [bg, fg] = (colors[sc] || colors.gray).split('|');
  return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:6px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="badge badge-blue">${escHtml(l.company)}</span>
        <span style="font-weight:500;font-size:13px">${escHtml(l.name)}</span>
        <span style="font-size:11px;color:var(--color-text-secondary)">${escHtml(l.id)}</span>
        ${reviewChip(l)}
      </div>
      <span class="status-pill" style="background:${bg};color:${fg}">${sl}</span>
    </div>
    <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:4px">${escHtml(l.type)} · No: ${escHtml(l.number || '-')} · ${escHtml(l.from || '')} → ${escHtml(l.till || '')} · Action: ${escHtml(l.action || '-')}</div>`;
}
function renderReview(filteredAll) {
  // Only licenses that are expiring soon or expired come to the reviewer
  const needsReview = l => ['Expiring Soon','Expired'].includes(statusLabel(daysUntil(l.till), l.status, l.type));
  const mine = scopedLicenses().filter(l => can('review', l.company) && needsReview(l));
  const f = state.rvFilter || 'All';
  const match = l => f === 'All' ? true : f === 'Needs my action' ? (l.reviewState === RV.WAIT_REV || !l.reviewState) : f === 'With dept' ? l.reviewState === RV.WAIT_DEPT : l.reviewState === RV.CLOSED;
  const sorted = mine.filter(match).sort((a, b) => rvPriority(a) - rvPriority(b));
  const nRev = mine.filter(l => l.reviewState === RV.WAIT_REV).length, nNew = mine.filter(l => !l.reviewState).length,
        nDept = mine.filter(l => l.reviewState === RV.WAIT_DEPT).length, nClosed = mine.filter(l => l.reviewState === RV.CLOSED).length;
  return `<div class="card">
    <div class="card-header">
      <span class="card-title">Review Queue</span>
      <div class="toolbar">
        <span class="badge badge-blue" title="Concerned department has replied">${nRev} reply to review</span>
        <span class="badge badge-amber" title="No feedback sent yet">${nNew} not yet reviewed</span>
        <span class="badge badge-gray" title="Waiting for the concerned department">${nDept} with dept</span>
        <span class="badge badge-green">${nClosed} approved</span>
      </div>
    </div>
    <div style="padding:10px 16px;font-size:12px;color:var(--color-text-secondary);border-bottom:0.5px solid var(--color-border-tertiary)">Showing only licenses that are expiring soon or expired.</div>
    <div class="filter-row"><span class="filter-label">Show:</span>
      ${['All', 'Needs my action', 'With dept', 'Approved'].map(s => { const v = s === 'Approved' ? 'Closed' : s; return `<button class="filter-btn${(f === v) ? ' active' : ''}" onclick="setRvFilter('${v}')">${s}</button>`; }).join('')}
    </div>
    ${sorted.length ? sorted.map(l => `<div style="padding:14px 16px;border-bottom:0.5px solid var(--color-border-tertiary)">
      ${rvHead(l)}
      ${renderThread(l)}
      ${l.reviewState === RV.CLOSED

}

// Feedback menu (Operations) — the shared conversation view for reviewer and concerned dept
function renderFeedback() {

  const nMe = scope.filter(waitingForMe).length, nWait = scope.filter(waiting).length, nNone = scope.filter(l => !l.reviewState).length, nClosed = scope.filter(closed).length;

    </div>

          : `${rev ? rvCompose(l, 'Reviewer') : ''}${dept && !rev ? rvCompose(l, 'Dept') : ''}${dept && rev ? `<div style="font-size:11px;color:var(--color-text-tertiary);margin-top:8px">Reply on behalf of the department:</div>${rvCompose(l, 'Dept')}` : ''}
             <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center">

               ${rev ? `<button class="btn btn-sm" onclick="approveReview('${l.id}')" title="Close this review and lock the record">${ic('check')} Approve &amp; lock</button>` : ''}

// =====================================================================
// Notifications — email + WhatsApp
// Rules decide which licenses are "due" for a notice; the Notification
// Center lists them with one-click Email / WhatsApp links (the viewer
// presses send). The same rules, recipients and licence data live in the
// shared database so a daily scheduled task can send the emails without
// anyone opening the app.
// =====================================================================
const NOTI = { cfg: null, notified: {}, lastRun: null, db: 'local', syncErr: false };
const NOTI_DEFAULT_SUBJECT = '[BLMS] {unit}: {license} — {statusText}';
const NOTI_DEFAULT_BODY = 'Dear Team,\n\nThis is an automated reminder from the Bitopi Group Business Licenses Monitoring System (BLMS).\n\nUnit: {unit}\nLicense: {license} ({type})\nLicense No.: {number}\nValid till: {till}\nStatus: {statusText}\nAction required: {action}\n\nPlease take the necessary action and update the record in BLMS.\n\nRegards,\nBLMS — Bitopi Group';
const NOTI_DEFAULT_WA = '*BLMS alert — {unit}*\n{license} ({number})\nValid till {till} — {statusText}.\nAction: {action}';

function defaultNotifyCfg() {
  const rec = { ALL: { emails: [...state.adminData.emails], phones: [] } };
  COMPANIES.forEach(c => { rec[c] = { emails: [], phones: [] }; });
  return { email: true, whatsapp: true, autoEmail: false, stages: [60, 30, 15, 7], notifyExpired: true, repeatDays: 7,
    sendTime: '09:00', recipients: rec, emailSubject: NOTI_DEFAULT_SUBJECT, emailBody: NOTI_DEFAULT_BODY, waBody: NOTI_DEFAULT_WA };
}
function mergeCfg(d) {
  const base = defaultNotifyCfg();
  const out = Object.assign(base, d || {});
  out.recipients = Object.assign(base.recipients, (d && d.recipients) || {});
  if (!Array.isArray(out.stages) || !out.stages.length) out.stages = base.stages;
  return out;
}
NOTI.cfg = defaultNotifyCfg();

function isNotifyAdmin() { return state.role === 'Administrator'; }
function splitList(s) { return String(s || '').split(/[\s,;]+/).map(x => x.trim()).filter(Boolean); }
function uniq(a) { return [...new Set(a)]; }
function normPhone(p) {
  let d = String(p).replace(/\D/g, '');
  if (/^01\d{9}$/.test(d)) d = '88' + d;          // Bangladesh mobile written locally
  return d;
}
function recipientsFor(unit) {
  const r = NOTI.cfg.recipients, a = r.ALL || { emails: [], phones: [] }, u = r[unit] || { emails: [], phones: [] };
  return { emails: uniq([...(a.emails || []), ...(u.emails || [])]), phones: uniq([...(a.phones || []), ...(u.phones || [])].map(normPhone)).filter(Boolean) };
}
function stageFor(l) {
  const days = daysUntil(l.till), color = statusColor(days, l.type, l.status);
  if (days === null) return null;
  if (color === 'red') return NOTI.cfg.notifyExpired ? { key: 'EXPIRED', label: 'Expired' } : null;
  const t = [...NOTI.cfg.stages].map(Number).filter(n => n > 0).sort((a, b) => a - b).find(n => days <= n);
  return t === undefined ? null : { key: 'T-' + t, label: t + '-day notice' };
}
function dueStage(l) {
  const s = stageFor(l); if (!s) return null;
  const n = NOTI.notified[dbId(l.id)];
  if (n && n.till === l.till && n.stage === s.key) {
    if (s.key === 'EXPIRED' && NOTI.cfg.repeatDays > 0 && Date.now() - n.at >= NOTI.cfg.repeatDays * 864e5) return s;
    return null;
  }
  return s;
}
function statusTextFor(l) {
  const d = daysUntil(l.till);
  if (l.status === 'Suspended') return 'suspended';
  if (d < 0) return 'expired ' + Math.abs(d) + ' day' + (Math.abs(d) === 1 ? '' : 's') + ' ago';
  if (l.status === 'Expired') return 'marked Expired';
  if (d === 0) return 'expires today';
  return 'expires in ' + d + ' day' + (d === 1 ? '' : 's');
}
function dueList() {
  return scopedLicenses().map(l => ({ l, s: dueStage(l), days: daysUntil(l.till) })).filter(x => x.s)
    .sort((a, b) => a.days - b.days);
}
function fillTpl(t, v) { return String(t).replace(/\{(\w+)\}/g, (m, k) => v[k] !== undefined ? v[k] : m); }
function notifyVars(l) {
  const color = statusColor(daysUntil(l.till), l.type, l.status);
  return { unit: l.company, license: l.name, type: l.type, number: l.number || '—', till: l.till || '—', days: Math.abs(daysUntil(l.till)),
    statusText: statusTextFor(l), action: (RAG[color] || RAG.amber).action };
}
function emailFor(l) { const v = notifyVars(l); return { subject: fillTpl(NOTI.cfg.emailSubject, v), body: fillTpl(NOTI.cfg.emailBody, v) }; }
function waFor(l) { return fillTpl(NOTI.cfg.waBody, notifyVars(l)); }
function mailtoHref(to, subject, body) { return 'mailto:' + to.join(',') + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body); }
function digestFor(items) {
  const lines = items.map(x => `- ${x.l.company} | ${x.l.name} | ${x.l.number || '—'} | valid till ${x.l.till || '—'} | ${statusTextFor(x.l)}`).join('\n');
  return { subject: `[BLMS] ${items.length} license${items.length === 1 ? '' : 's'} need attention`,
    body: `Dear Team,\n\nThe Business Licenses Monitoring System (BLMS) lists ${items.length} license${items.length === 1 ? '' : 's'} that need attention:\n\n${lines}\n\nPlease take the necessary action and update the records in BLMS.\n\nRegards,\nBLMS — Bitopi Group` };
}

// ---- shared database (licenses, notification settings, sent notices) ----
let DBH = null, dbReady = false, syncTimer = null, flushing = false, lastSynced = {}, nextSeq = 1;
function dbId(id) { return String(id).replace(/[^A-Za-z0-9_\-.~:@+]/g, '_').slice(0, 190) || 'x'; }
function licSig(l) { const o = {}; Object.keys(l).filter(k => k !== 'docs').sort().forEach(k => { o[k] = l[k]; }); return JSON.stringify(o); }
function licToDoc(l) { const o = {}; Object.keys(l).forEach(k => { if (k !== 'docs' && l[k] !== undefined) o[k] = l[k]; }); return o; }
function scheduleSync() {
  if (!dbReady || syncTimer || flushing) return;
  let diff = false; const seen = new Set();
  state.licenses.forEach(l => { if (l.seq == null) l.seq = nextSeq++; const k = dbId(l.id); seen.add(k); if (lastSynced[k] !== licSig(l)) diff = true; });
  Object.keys(lastSynced).forEach(k => { if (!seen.has(k)) diff = true; });
  if (diff) syncTimer = setTimeout(flushSync, 400);
}
async function flushSync() {
  syncTimer = null; if (!dbReady || flushing) return;
  flushing = true;
  try {
    const cur = {}; state.licenses.forEach(l => { cur[dbId(l.id)] = l; });
    for (const k of Object.keys(cur)) { const sig = licSig(cur[k]); if (lastSynced[k] !== sig) { await DBH.doc('licenses/' + k).set(licToDoc(cur[k])); lastSynced[k] = sig; } }
    for (const k of Object.keys(lastSynced)) { if (!cur[k]) { await DBH.doc('licenses/' + k).delete(); delete lastSynced[k]; } }
    NOTI.syncErr = false;
  } catch (e) {
    if (!NOTI.syncErr) { NOTI.syncErr = true; showToast('Could not save to the shared database (' + ((e && e.code) || 'error') + '). Changes stay on this page only.', 'error'); }
  }
  flushing = false;
}
function applyLicSnapshot(snap) {
  if (syncTimer || flushing) return;
  const old = {}; state.licenses.forEach(l => { old[dbId(l.id)] = l; });
  const next = snap.docs.map(d => d.data()).filter(Boolean).sort((a, b) => (a.seq || 0) - (b.seq || 0)).map(x => {
    const c = JSON.parse(JSON.stringify(x)), o = old[dbId(x.id)]; if (o && o.docs) c.docs = o.docs; return c; });
  const changed = JSON.stringify(next.map(licSig)) !== JSON.stringify(state.licenses.map(licSig));
  lastSynced = {}; next.forEach(l => { lastSynced[dbId(l.id)] = licSig(l); });
  nextSeq = Math.max(0, ...next.map(l => l.seq || 0)) + 1;
  const first = !dbReady; dbReady = true;
  if (changed) { captureEntryForm(); state.licenses = next; render(); } else if (first) render();
}
async function initDb() {
  try {
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    const db = await window.claude.use('db'); if (!db) return;
    DBH = db;
    const meta = await db.doc('config/meta').get();
    if (!meta.exists) {
      for (let i = 0; i < state.licenses.length; i++) { const l = state.licenses[i]; l.seq = i + 1; await db.doc('licenses/' + dbId(l.id)).set(licToDoc(l)); }
      await db.doc('config/notify').set(Object.assign({}, NOTI.cfg, { updatedAt: Date.now(), updatedBy: currentUser().name }));
      await db.doc('config/meta').set({ seeded: true, at: Date.now() });
    }
    NOTI.db = 'connected';
    const ud = await db.doc('config/users').get();
    if (ud.exists && ud.data() && Array.isArray(ud.data().list) && ud.data().list.length) {
      const before = JSON.stringify(ud.data().list);
      state.adminData.users = migrateUsers(JSON.parse(before));
      if (JSON.stringify(state.adminData.users) !== before) await db.doc('config/users').set({ list: state.adminData.users, updatedAt: Date.now(), updatedBy: 'system' });
    }
    else await db.doc('config/users').set({ list: state.adminData.users, updatedAt: Date.now(), updatedBy: 'system' });
    usersSig = JSON.stringify(state.adminData.users); usersReady = true;
    db.doc('config/users').onSnapshot(s => {
      if (!s.exists) return;
      const l = s.data() && s.data().list; if (!Array.isArray(l) || !l.length) return;
      const sig = JSON.stringify(l); if (sig === usersSig) return;
      usersSig = sig; state.adminData.users = migrateUsers(JSON.parse(sig));
      if (state.authed && !l.some(x => x.id === state.userId)) { state.authed = false; state.loginForce = true; state.loginErr = 'Your account was removed. Contact your administrator.'; }
      render();
    });
    render();
    db.doc('config/notify').onSnapshot(s => {
      if (!s.exists) return;
      const next = mergeCfg(s.data());
      if (JSON.stringify(next) !== JSON.stringify(NOTI.cfg)) { NOTI.cfg = next; if (state.activeTab === 'notify') render(); }
    });
    db.collection('notified').onSnapshot(s => {
      const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); });
      if (JSON.stringify(m) !== JSON.stringify(NOTI.notified)) { NOTI.notified = m; if (state.activeTab === 'notify') render(); }
    });
    db.doc('config/lastrun').onSnapshot(s => {
      const v = s.exists ? s.data() : null;
      if (JSON.stringify(v) !== JSON.stringify(NOTI.lastRun)) { NOTI.lastRun = v; if (state.activeTab === 'notify') render(); }
    });
    db.collection('licenses').onSnapshot(applyLicSnapshot, e => { NOTI.db = 'error'; });
  } catch (e) { NOTI.db = 'error'; }
}
function saveNotifyCfg(summary, changes) {
  if (DBH) DBH.doc('config/notify').set(Object.assign({}, NOTI.cfg, { updatedAt: Date.now(), updatedBy: currentUser().name })).catch(() => showToast('Settings could not be saved to the shared database.', 'error'));
  auditLog('Admin', 'Notifications', '', '', summary, changes || []);
}
function persistNotified(l, rec) {
  const k = dbId(l.id); NOTI.notified[k] = rec;
  if (DBH) DBH.doc('notified/' + k).set(rec).catch(() => showToast('Could not record the notice in the shared database.', 'error'));
}

// ---- actions ----
function copyText(t, msg) {
  const done = () => showToast(msg || 'Copied.', 'success');
  const fallback = () => { try { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); } catch (e) { showToast('Copy is not available here — select the text and copy it manually.', 'error'); } };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback(); } catch (e) { fallback(); }
}
window.nCopyEmail = id => { const l = state.licenses.find(x => x.id === id); if (!l) return; const m = emailFor(l); copyText(m.subject + '\n\n' + m.body, 'Email text copied.'); };
window.nCopyWa = id => { const l = state.licenses.find(x => x.id === id); if (l) copyText(waFor(l), 'WhatsApp text copied.'); };
window.nCopyDigest = () => { const d = digestFor(dueList()); copyText(d.subject + '\n\n' + d.body, 'Digest copied.'); };
// Open the mail / WhatsApp link and keep the message text on the clipboard as a
// backup, because some browsers or embedded views block mailto: and wa.me links.
window.nOpen = (ev, kind, id) => {
  const l = id ? state.licenses.find(x => x.id === id) : null;
  let text = '';
  if (kind === 'wa' && l) text = waFor(l);
  else if (kind === 'mail' && l) { const m = emailFor(l); text = m.subject + '\n\n' + m.body; }
  else if (kind === 'digest') { const d = digestFor(dueList()); text = d.subject + '\n\n' + d.body; }
  try { if (text && navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(() => {}); } catch (e) {}
  showToast('Opening your ' + (kind === 'wa' ? 'WhatsApp' : 'email') + '… the text is also copied — if nothing opened, paste it. Then press “Mark sent”.', 'info');
};
window.nMarkSent = id => {
  const l = state.licenses.find(x => x.id === id); if (!l) return;
  const s = stageFor(l); if (!s) return;
  if (!can('review', l.company) && !can('entry', l.company) && state.role !== 'Administrator') { showToast('Your role does not allow recording notices for ' + l.company + '.', 'error'); return; }
  persistNotified(l, { licId: l.id, unit: l.company, name: l.name, stage: s.key, label: s.label, till: l.till, at: Date.now(), by: currentUser().name, via: 'manual' });
  auditLog('Notify', 'License', l.id, l.company, `${s.label} sent for ${l.name}`, [{ field: 'Notice', from: '—', to: s.label + ' (manual)' }]);
  logActivity('notify', `${s.label} sent for <b>${l.name}</b> (${l.id})`, l.company);
  showToast('Recorded: ' + s.label + ' for ' + l.name + '.', 'success'); render();
};
window.nMarkAll = () => {
  const items = dueList(); if (!items.length) return;
  askConfirm(`Mark all ${items.length} due notice(s) as sent?`, () => {
    items.forEach(x => { persistNotified(x.l, { licId: x.l.id, unit: x.l.company, name: x.l.name, stage: x.s.key, label: x.s.label, till: x.l.till, at: Date.now(), by: currentUser().name, via: 'manual' }); });
    auditLog('Notify', 'License', '', '', `Marked ${items.length} notice(s) as sent`, []);
    showToast(`Marked ${items.length} notice(s) as sent.`, 'success'); render();
  });
};
window.nSaveRules = () => {
  if (!isNotifyAdmin()) return;
  const g = id => document.getElementById(id);
  const stages = uniq(splitList(g('nStages').value).map(Number).filter(n => Number.isInteger(n) && n > 0 && n <= 365)).sort((a, b) => b - a);
  if (!stages.length) { showToast('Enter at least one notice day, e.g. 60, 30, 15, 7.', 'error'); return; }
  const rep = Math.max(0, Math.min(365, parseInt(g('nRepeat').value) || 0));
  const prev = JSON.stringify([NOTI.cfg.email, NOTI.cfg.whatsapp, NOTI.cfg.autoEmail, NOTI.cfg.stages, NOTI.cfg.notifyExpired, NOTI.cfg.repeatDays]);
  Object.assign(NOTI.cfg, { email: g('nEmail').checked, whatsapp: g('nWa').checked, autoEmail: g('nAuto').checked, stages, notifyExpired: g('nExpired').checked, repeatDays: rep });
  const cur = JSON.stringify([NOTI.cfg.email, NOTI.cfg.whatsapp, NOTI.cfg.autoEmail, NOTI.cfg.stages, NOTI.cfg.notifyExpired, NOTI.cfg.repeatDays]);
  if (prev !== cur) saveNotifyCfg('Updated notification rules', [{ field: 'Notice days', from: '', to: stages.join(', ') + ' · expired repeat ' + rep + 'd · auto email ' + (NOTI.cfg.autoEmail ? 'on' : 'off') }]);
  showToast('Notification rules saved.', 'success'); render();
};
window.nSaveRecipients = () => {
  if (!isNotifyAdmin()) return;
  const keys = ['ALL', ...COMPANIES], rec = {}, bad = [];
  keys.forEach((k, i) => {
    const emails = uniq(splitList(document.getElementById('nrE_' + i).value).map(x => x.toLowerCase()));
    const phones = uniq(splitList(document.getElementById('nrP_' + i).value).map(normPhone).filter(Boolean));
    emails.forEach(e => { if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) bad.push(e); });
    phones.forEach(p => { if (p.length < 10 || p.length > 15) bad.push(p); });
    rec[k] = { emails, phones };
  });
  if (bad.length) { showToast('Fix these entries first: ' + bad.slice(0, 4).map(escHtml).join(', ') + (bad.length > 4 ? '…' : ''), 'error'); return; }
  NOTI.cfg.recipients = rec;
  const n = Object.values(rec).reduce((a, r) => a + r.emails.length + r.phones.length, 0);
  saveNotifyCfg('Updated notification recipients', [{ field: 'Recipients', from: '', to: n + ' address/number(s) across ' + keys.length + ' lists' }]);
  showToast('Recipients saved.', 'success'); render();
};
window.nSaveTemplates = () => {

  saveNotifyCfg('Updated notification message templates', []);
  showToast('Templates saved.', 'success'); render();
};
window.nResetTemplates = () => {
  if (!isNotifyAdmin()) return;
  Object.assign(NOTI.cfg, { emailSubject: NOTI_DEFAULT_SUBJECT, emailBody: NOTI_DEFAULT_BODY, waBody: NOTI_DEFAULT_WA });
  saveNotifyCfg('Reset notification message templates to default', []); showToast('Templates reset to default.', 'success'); render();
};

// ---- screen ----
function renderNotify() {
  const cfg = NOTI.cfg, admin = isNotifyAdmin(), dis = admin ? '' : ' disabled';
  const due = dueList(), keys = ['ALL', ...COMPANIES];
  const allEmails = uniq(due.flatMap(x => recipientsFor(x.l.company).emails));
  const hist = Object.values(NOTI.notified).filter(n => inScope(n.unit)).sort((a, b) => b.at - a.at).slice(0, 50);
  const dbBadge = NOTI.db === 'connected' ? `<span class="badge badge-green">Shared database connected</span>` : NOTI.db === 'error' ? `<span class="badge badge-red">Database unavailable</span>` : `<span class="badge badge-amber">This page only — database not connected</span>`;
  const sample = due[0] ? due[0].l : scopedLicenses()[0];
  const prev = sample ? (() => { const m = emailFor(sample); return { s: m.subject, b: m.body, w: waFor(sample) }; })() : null;
  const hasEmail = cfg.email, hasWa = cfg.whatsapp;
  const rowHtml = due.map(x => {
    const l = x.l, r = recipientsFor(l.company), em = emailFor(l), color = statusColor(x.days, l.type, l.status), rg = RAG[color];
    const canMark = admin || can('review', l.company) || can('entry', l.company);
    const waLinks = hasWa ? r.phones.map(p => `<a class="btn btn-sm" href="https://wa.me/${p}?text=${encodeURIComponent(waFor(l))}" target="_blank" rel="noopener" onclick="nOpen(event,'wa','${l.id}')" title="WhatsApp +${p}">WhatsApp ···${p.slice(-4)}</a>`).join('') : '';
    const mailLink = hasEmail ? (r.emails.length ? `<a class="btn btn-sm" href="${mailtoHref(r.emails, em.subject, em.body).replace(/"/g, '&quot;')}" onclick="nOpen(event,'mail','${l.id}')" title="To: ${escHtml(r.emails.join(', '))}">Email</a>` : `<span class="btn btn-sm" style="opacity:.5;cursor:default" title="No email recipients for ${l.company} — add them below">Email</span>`) : '';
    return `<tr>
      <td style="font-size:11px;color:var(--color-text-secondary)">${escHtml(l.id)}</td>
      <td><span class="badge badge-blue">${escHtml(l.company)}</span></td>
      <td style="font-weight:500">${escHtml(l.name)}<br><span style="font-size:11px;font-weight:400;color:var(--color-text-secondary)">${escHtml(l.number || '')}</span></td>
      <td style="font-size:12px">${escHtml(l.till || '')}</td>
      <td><span class="status-pill" style="background:${rg.bg};color:${rg.fg}">${escHtml(x.s.label)}</span><br><span style="font-size:10px;color:${rg.fg}">${escHtml(statusTextFor(l))}</span></td>
      <td><div style="display:flex;gap:4px;flex-wrap:wrap">${mailLink}${waLinks}
        ${hasEmail ? `<button class="btn btn-sm" onclick="nCopyEmail('${l.id}')" title="Copy the email text">${ic('file')}</button>` : ''}
        ${hasWa ? `<button class="btn btn-sm" onclick="nCopyWa('${l.id}')" title="Copy the WhatsApp text (paste into a group)">${ic('message')}</button>` : ''}
        ${canMark ? `<button class="btn btn-sm btn-primary" onclick="nMarkSent('${l.id}')" title="Record this notice as sent">${ic('check')} Mark sent</button>` : ''}</div></td>
    </tr>`;
  }).join('');
  const lblStyle = 'font-size:12px;display:flex;align-items:center;gap:6px';
  return `
  <div class="card" style="margin-bottom:16px">
    <div class="card-header">
      <span class="card-title">${ic('bell')} Notification Center — Email &amp; WhatsApp</span>
      ${dbBadge}
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;padding:14px 16px">
      <div style="border:0.5px solid var(--color-border-tertiary);border-radius:6px;padding:10px 12px"><div style="font-size:11px;color:var(--color-text-secondary)">Due now</div><div style="font-size:20px;font-weight:600;color:${due.length ? '#854F0B' : '#3B6D11'}">${due.length}</div></div>
      <div style="border:0.5px solid var(--color-border-tertiary);border-radius:6px;padding:10px 12px"><div style="font-size:11px;color:var(--color-text-secondary)">Notices recorded</div><div style="font-size:20px;font-weight:600">${hist.length}</div></div>
      <div style="border:0.5px solid var(--color-border-tertiary);border-radius:6px;padding:10px 12px"><div style="font-size:11px;color:var(--color-text-secondary)">Notice days</div><div style="font-size:15px;font-weight:600;padding-top:4px">${[...cfg.stages].sort((a, b) => b - a).join(' · ')}${cfg.notifyExpired ? ' · expired' : ''}</div></div>
      <div style="border:0.5px solid var(--color-border-tertiary);border-radius:6px;padding:10px 12px"><div style="font-size:11px;color:var(--color-text-secondary)">Automatic email</div><div style="font-size:20px;font-weight:600">${cfg.autoEmail ? 'On · daily' : 'Off'}</div></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-header">
      <span class="card-title">Due now — notices waiting to be sent</span>
      <div class="toolbar">
        ${due.length && hasEmail && allEmails.length ? (() => { const d = digestFor(due); return `<a class="btn btn-sm" href="${mailtoHref(allEmails, d.subject, d.body).replace(/"/g, '&quot;')}" onclick="nOpen(event,'digest')" title="One email listing every due license">${ic('mail')} Email digest</a>`; })() : ''}
        ${due.length ? `<button class="btn btn-sm" onclick="nCopyDigest()">${ic('file')} Copy digest</button>` : ''}
        ${due.length ? `<button class="btn btn-sm" onclick="nMarkAll()">${ic('check')} Mark all sent</button>` : ''}
      </div>
    </div>
    ${due.length ? `<div class="table-wrap"><table><thead><tr><th>L No</th><th>Unit</th><th>License</th><th>Valid till</th><th>Notice</th><th>Send</th></tr></thead><tbody>${rowHtml}</tbody></table></div>
      <div style="padding:10px 16px;font-size:11px;color:var(--color-text-secondary)">Email and WhatsApp open ready-written messages addressed to the unit's recipients. After you send, press “Mark sent” so the notice leaves this list and is not repeated until the next stage.</div>`
      : `<div class="empty-state">${ic('check','style="font-size:22px;display:block;margin-bottom:6px;color:#3B6D11"')}Nothing due. Every license in your units is either outside the notice window or already notified.</div>`}
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-header"><span class="card-title">Rules &amp; automatic sending</span>${admin ? '' : '<span style="font-size:11px;color:var(--color-text-secondary)">View only — Administrators edit</span>'}</div>
    <div style="padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px">
      <div class="form-group"><label class="form-label">Channels</label>
        <label style="${lblStyle}"><input type="checkbox" id="nEmail"${cfg.email ? ' checked' : ''}${dis}> Email</label>
        <label style="${lblStyle}"><input type="checkbox" id="nWa"${cfg.whatsapp ? ' checked' : ''}${dis}> WhatsApp (click-to-send)</label></div>
      <div class="form-group"><label class="form-label">Notice days before expiry</label>
        <input class="form-control" id="nStages" value="${escHtml([...cfg.stages].sort((a, b) => b - a).join(', '))}" placeholder="60, 30, 15, 7"${dis}>
        <span style="font-size:11px;color:var(--color-text-tertiary)">A notice is due each time a license crosses one of these.</span></div>
      <div class="form-group"><label class="form-label">When expired</label>
        <label style="${lblStyle}"><input type="checkbox" id="nExpired"${cfg.notifyExpired ? ' checked' : ''}${dis}> Send an “Expired” notice</label>
        <div style="display:flex;align-items:center;gap:6px;font-size:12px">Repeat every <input class="form-control" id="nRepeat" type="number" min="0" max="365" style="width:64px" value="${cfg.repeatDays}"${dis}> days (0 = once)</div></div>
      <div class="form-group"><label class="form-label">Automatic email (daily)</label>
        <label style="${lblStyle}"><input type="checkbox" id="nAuto"${cfg.autoEmail ? ' checked' : ''}${dis}> Send due emails automatically</label>
        <div style="font-size:12px;color:var(--color-text-secondary)">Runs once a day, at about 9:00 AM Dhaka time.</div>
        <span style="font-size:11px;color:var(--color-text-tertiary)">${NOTI.lastRun ? 'Last automatic run: ' + escHtml(new Date(NOTI.lastRun.at || 0).toLocaleString()) + ' — ' + escHtml(String(NOTI.lastRun.summary || '')) : 'No automatic run recorded yet.'}</span></div>
    </div>
    ${admin ? `<div class="form-actions"><button class="btn btn-primary" onclick="nSaveRules()">${ic('device-floppy')} Save rules</button></div>` : ''}
    <div style="padding:0 16px 14px;font-size:11px;color:var(--color-text-secondary);line-height:1.5">Automatic sending runs as a daily scheduled task using the connected Gmail account, reading these rules, the recipients and the licenses from the shared database. WhatsApp cannot be sent automatically from here — those messages open in WhatsApp for a person to send.</div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-header"><span class="card-title">Recipients</span></div>
    <div style="padding:12px 16px;font-size:11px;color:var(--color-text-secondary)">“All units” receives every notice; a unit's own list is added on top for that unit. Separate entries with commas or new lines. WhatsApp numbers with country code (e.g. 8801712345678); local 01XXXXXXXXX numbers are treated as Bangladesh (+880).</div>
    <div class="table-wrap"><table><thead><tr><th style="width:110px">List</th><th>Email addresses</th><th>WhatsApp numbers</th></tr></thead><tbody>
      ${keys.map((k, i) => { const r = cfg.recipients[k] || { emails: [], phones: [] }; return `<tr>
        <td style="font-weight:500">${k === 'ALL' ? 'All units' : escHtml(k)}</td>
        <td><textarea class="form-control" id="nrE_${i}" rows="2" style="resize:vertical;font-size:12px"${dis}>${escHtml((r.emails || []).join('\n'))}</textarea></td>
        <td><textarea class="form-control" id="nrP_${i}" rows="2" style="resize:vertical;font-size:12px"${dis}>${escHtml((r.phones || []).join('\n'))}</textarea></td></tr>`; }).join('')}
    </tbody></table></div>
    ${admin ? `<div class="form-actions"><button class="btn btn-primary" onclick="nSaveRecipients()">${ic('device-floppy')} Save recipients</button></div>` : ''}
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-header"><span class="card-title">Message templates</span>${admin ? `<button class="btn btn-sm" onclick="nResetTemplates()">Reset to default</button>` : ''}</div>
    <div style="padding:12px 16px;font-size:11px;color:var(--color-text-secondary)">Placeholders: {unit} {license} {type} {number} {till} {days} {statusText} {action}</div>
    <div style="padding:0 16px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">
      <div class="form-group" style="grid-column:1/-1"><label class="form-label">Email subject</label><input class="form-control" id="nSubj" value="${escHtml(cfg.emailSubject)}"${dis}></div>
      <div class="form-group"><label class="form-label">Email text</label><textarea class="form-control" id="nBody" rows="11" style="resize:vertical;font-size:12px"${dis}>${escHtml(cfg.emailBody)}</textarea></div>
      <div class="form-group"><label class="form-label">WhatsApp text</label><textarea class="form-control" id="nWaTpl" rows="11" style="resize:vertical;font-size:12px"${dis}>${escHtml(cfg.waBody)}</textarea></div>
    </div>
    ${prev ? `<div style="padding:0 16px 16px"><div class="form-label" style="margin-bottom:6px">Preview — ${escHtml(sample.name)} (${escHtml(sample.company)}), saved templates</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px">
        <pre style="margin:0;white-space:pre-wrap;font:12px/1.5 var(--font-sans, inherit);padding:10px;border:0.5px solid var(--color-border-tertiary);border-radius:6px;background:var(--color-background-secondary, #f9f9f9)"><b>${escHtml(prev.s)}</b>\n\n${escHtml(prev.b)}</pre>
        <pre style="margin:0;white-space:pre-wrap;font:12px/1.5 var(--font-sans, inherit);padding:10px;border:0.5px solid var(--color-border-tertiary);border-radius:6px;background:var(--color-background-secondary, #f9f9f9)">${escHtml(prev.w)}</pre></div></div>` : ''}
    ${admin ? `<div class="form-actions"><button class="btn btn-primary" onclick="nSaveTemplates()">${ic('device-floppy')} Save templates</button></div>` : ''}
  </div>

  <div class="card">
    <div class="card-header"><span class="card-title">Notice history</span><span style="font-size:11px;color:var(--color-text-secondary)">Latest notice per license</span></div>
    ${hist.length ? `<div class="table-wrap"><table><thead><tr><th>When</th><th>L No</th><th>Unit</th><th>License</th><th>Notice</th><th>Sent by</th></tr></thead><tbody>
      ${hist.map(n => `<tr><td style="font-size:12px;white-space:nowrap">${escHtml(fmtTs(n.at))}</td><td style="font-size:11px">${escHtml(n.licId || '')}</td><td><span class="badge badge-blue">${escHtml(n.unit || '')}</span></td><td>${escHtml(n.name || '')}</td><td>${escHtml(n.label || n.stage || '')}</td><td style="font-size:12px">${n.via === 'auto' ? 'Automatic email' : escHtml(n.by || '')}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty-state">${ic('inbox','style="font-size:22px;display:block;margin-bottom:6px"')}No notices recorded yet.</div>`}
  </div>`;
}


if (!state.audit.length) auditLog('System','Audit log','','','Audit logging enabled',[]);
logActivity('system', `Session started — monitoring ${state.licenses.length} licenses across ${COMPANIES.length} units`, '');
state.activitySeen = state.activity.length;
try { const rid = localStorage.getItem('blms_remember'), ru = rid && state.adminData.users.find(x => x.id === rid); if (ru) signInAs(ru, true); } catch (e) {}
render();
initDb();
</script>


</body></html>
